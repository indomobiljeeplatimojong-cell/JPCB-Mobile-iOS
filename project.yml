name: JPCBMobile

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  JPCBMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: JPCBMobile

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indomobiljeeplatimojong.jpcbmobile
        PRODUCT_NAME: JPCB Mobile
        INFOPLIST_KEY_CFBundleDisplayName: JPCB Mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
